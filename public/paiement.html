<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paiement - Anim-Formation</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>

</head>

<body>

<header class="header">
<div class="logo">ANIM</div>

<nav>
<a href="index.html">Accueil</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<section class="payment-section">

<div class="payment-card">

<h1>Finaliser votre inscription</h1>

<p class="payment-description">
Accédez immédiatement à la formation complète.
</p>

<div class="price-recap">
<p>Formation complète Anim-Formation</p>
<h2>10 000 FCFA</h2>
</div>

<input
type="email"
id="email"
placeholder="Votre email"
required
class="input-field"
/>

<button id="btn-payer" class="btn-main">
💳 Payer maintenant
</button>

<p class="secure-text">
Paiement sécurisé via FedaPay
</p>

</div>

</section>

<footer class="footer">
<p>© 2026 Anim-Formation</p>
</footer>

<script>

const PUBLIC_KEY = "pk_live_McGxiTj5lNJ7MPzCb_qDx-lW"

document.getElementById("btn-payer").onclick = () => {

const email = document.getElementById("email").value.trim()

if(!email){
alert("Veuillez entrer votre email")
return
}

const checkout = FedaPay.init({

public_key: PUBLIC_KEY,
environment: "live",

transaction: {

amount: 100,
description: "Formation Anim-Formation",

metadata: {
email: email
}

},

customer: {
email: email
},

onComplete: async ({reason, transaction}) => {

if(reason === FedaPay.CHECKOUT_COMPLETED){

try{

const response = await fetch("https://anim-formation.onrender.com/envoyer-acces",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
email: email,
transaction_id: transaction.id
})

})

const result = await response.text()

console.log("REPONSE SERVEUR :", result)

if(result === "EMAIL_ENVOYE"){

window.location.href="/confirmation.html"

}else{

alert("Paiement confirmé mais erreur d'envoi email. Contactez le support.")

}

}catch(err){

console.log("ERREUR FETCH :", err)

alert("Erreur connexion serveur")

}

}else{

alert("Paiement annulé")

}

}

})

checkout.open()

}

</script>

</body>
</html>
